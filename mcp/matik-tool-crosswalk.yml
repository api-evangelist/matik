source: >-
  mcp/matik-mcp.yml (published tool list, from
  https://help.matik.io/hc/en-us/articles/48790661770267--BETA-Matik-MCP-Server) bound
  against the 91 operations harvested from https://developer.matik.io/docs/matik/*
binding_note: >-
  Matik publishes NO OpenAPI document, so there are no operationIds to bind to. Rows bind
  each MCP tool to the METHOD + PATH of the REST operation as published in the developer
  reference. That is the strongest identifier Matik makes available; `rest` therefore
  carries paths, not operationIds, and `binding: rest-path` says so explicitly rather
  than inventing ids. The live MCP `tools/list` could not be introspected — the server
  URL is issued privately by a Matik Technical Account Manager — so tool input schemas
  are the names published in the help-centre article, not fetched schemas.
surfaces:
  openapi:
    published: false
    note: >-
      developer.matik.io is Docusaurus running docusaurus-plugin-openapi-docs (rendered
      pages carry the `openapi__heading` / `openapi-tabs__*` classes), so a source OpenAPI
      exists internally. It is not served: /openapi.json, /openapi.yaml, /matik.yaml on the
      docs host and /swagger, /swagger.json, /openapi.json, /api/1.0/swagger on the API
      host all 404 (app.matik.io answers unknown paths with an SPA shell, not a spec).
  rest:
    base_url: https://app.matik.io/api/1.0/
    reference: https://developer.matik.io/docs/matik/matik-external-api
    operations: 91
    gated: false
  graphql:
    published: false
  mcp:
    status: beta
    url: null
    gated: true
    note: >-
      Endpoint URL is not public — obtained from a Matik Technical Account Manager. OAuth
      2.0 with dynamic client registration. tools/list not introspectable anonymously.
    tools: 8
crosswalk:
  - tool: get_all_templates
    category: templates
    rest:
      - GET /api/1.0/templates
    binding: rest-path
    confidence: high
  - tool: get_inputs_for_template
    category: templates
    rest:
      - POST /api/1.0/templates/:template_id/inputs
      - GET /api/1.0/templates/:template_id/inputs/options/:bulk_query_id
    binding: rest-path
    confidence: high
    note: >-
      Fans out: the POST returns the input set, and dependent input options resolve
      asynchronously via the options/:bulk_query_id poll.
  - tool: query_callback
    category: async
    rest:
      - GET /api/1.0/templates/:template_id/inputs/options/:bulk_query_id
      - GET /api/1.0/dynamic_content/:dynamic_content_id/inputs/options/:bulk_query_id
      - GET /api/1.0/dynamic_content/query_status/:query_run_id
    binding: rest-path
    confidence: medium
    note: >-
      The MCP server exposes one polling tool over what REST splits into three distinct
      status endpoints. Which one backs a given call depends on whether the caller is
      resolving template inputs, dynamic-content inputs, or a raw query run.
  - tool: generate_content
    category: presentations
    rest:
      - POST /api/1.0/presentations/
      - GET /api/1.0/presentations/queue/:presentation_id
      - GET /api/1.0/presentations/:presentation_id
    binding: rest-path
    confidence: high
    note: >-
      Composite. The tool creates, polls to completion and returns a download URL; REST
      requires the caller to drive the create -> queue-poll -> fetch sequence itself
      (200 = still running, 303 = complete).
  - tool: search_dynamic_content
    category: dynamic-content
    rest:
      - GET /api/1.0/dynamic_content
    binding: rest-path
    confidence: medium
    note: >-
      The tool takes search_term/page/per_page. The REST list operation is documented
      without a published query-parameter reference, so the search parameter mapping is
      asserted from the MCP tool description, not from the spec.
  - tool: get_dynamic_content_by_name
    category: dynamic-content
    rest:
      - GET /api/1.0/dynamic_content/name/:dynamic_content_name
    binding: rest-path
    confidence: high
  - tool: get_inputs_for_dynamic_content
    category: dynamic-content
    rest:
      - POST /api/1.0/dynamic_content/:dynamic_content_id/inputs
    binding: rest-path
    confidence: high
  - tool: run_dynamic_content
    category: dynamic-content
    rest:
      - POST /api/1.0/dynamic_content/run/:dynamic_content_id
      - GET /api/1.0/dynamic_content/query_status/:query_run_id
    binding: rest-path
    confidence: high
