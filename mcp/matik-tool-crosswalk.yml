mcp_only_note: >-
  Every published MCP tool maps onto at least one documented REST operation. The MCP
  surface is a curated, composite subset of REST — it adds polling and download
  orchestration, not new capability.
rest_only:
  - capability: Data sources
    operations: 27
    note: >-
      The entire data-source surface — create/update/delete, connection tests, and the
      Metabase, Looker, Tableau, Google Sheets and Excel browse operations — has no MCP
      tool. This is the largest divergence: an agent can RUN dynamic content but cannot
      manage or inspect what it runs against.
  - capability: Templates (write)
    operations: 11
    note: >-
      create PowerPoint / Google Slides templates, copy from template library, delete,
      attachments, save folder, queue status, bulk inputs. MCP exposes read + inputs only.
  - capability: AI
