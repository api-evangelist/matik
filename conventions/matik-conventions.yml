async_operations:
  style: poll
  notes: >-
    Long-running operations (presentation generation, refresh, AI query building,
    analytics export, bulk presentations) are asynchronous. The create call returns
    an id and a Location header pointing at a status URL; poll it — 200 means still
    in progress, 303 means complete (Location carries the result URL).
pagination:
  style: page-number
  params:
    page: 0-indexed page number (default 0)
    per_page: results per page, 1-100 (default 20)
  source: https://help.matik.io/hc/en-us/articles/48790661770267--BETA-Matik-MCP-Server
  notes: Observed on Dynamic Content search; applied across list endpoints.
idempotency:
  supported: false
  notes: No idempotency-key contract is documented by Matik.
