vulnerability_disclosure:
  published: false
  note: >-
    Re-probed 2026-08-14. https://www.matik.io/security (HTTP 200, ~20k chars) contains no
    occurrence of "disclosure", "vulnerability", "bug bounty", "security@", "penetration"
    or "report a" — it is a security-posture page, not a disclosure policy. No security.txt,
    no HackerOne/Bugcrowd/Intigriti program. The `type: Security` pointer that the
    2026-07-20 pass wired at this URL has been REMOVED from apis.yml: the check it feeds
    (`security_disclosure`) asserts the provider publishes a way to report a vulnerability,
    and Matik does not. The `Compliance` and `TrustCenter` pointers at the same URL are
    correct and remain.
