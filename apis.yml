apis:
- name: Matik External API
  description: >-
    OAuth 2.0 REST API for automating content generation with Matik — manage templates,
    generate presentations/documents/spreadsheets, run dynamic content queries against
    connected data sources, manage data sources, bulk-generate, pull analytics, and
    subscribe to webhooks. 91 documented operations across 15 resource areas, the
    largest being data sources (27), templates (13) and dynamic content (11). No
    OpenAPI is published; the reference is Docusaurus-rendered and the only
    machine-readable client artifact is a Postman OAuth collection.
  humanURL: https://developer.matik.io/
  baseURL: https://app.matik.io/api/1.0/
