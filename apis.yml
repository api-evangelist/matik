aid: matik
name: Matik
description: >-
  Matik is a data-driven content automation platform that generates personalized
  presentations, documents, spreadsheets, reports, and emails directly from connected
  data sources — BI tools, CRMs, data warehouses, spreadsheets, and REST APIs. Teams
  in Sales, Customer Success, and Revenue Operations use templates with dynamic content,
  conditional logic, and AI-generated narratives to produce on-brand content at scale
  across Google Slides, PowerPoint, PDF, and email. Matik exposes a REST External API
  (OAuth 2.0) covering templates, presentations, dynamic content, data sources, bulk
  generation, analytics, webhooks, and AI query building, plus a beta MCP server for
  agent-driven content generation.
